<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Данил — главный экран (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --fg: #f2f1ec;
    --muted: #8a8c97;
    --accent: #c8ff2e;
    --line: rgba(255, 255, 255, .09);
    --pad: clamp(16px, 4vw, 56px);
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  .hero { position: relative; height: 100svh; min-height: 620px; overflow: hidden; background: #1a1b1e; }

  /* жидкий металл: холст в половинном разрешении, браузер растягивает его на весь экран */
  #metal { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  /* затемнение слева под текстом и снизу — для читаемости и перехода в следующий блок */
  .shade {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(10, 10, 11, .86) 0%, rgba(10, 10, 11, .62) 34%, rgba(10, 10, 11, .1) 62%, transparent 75%),
      linear-gradient(180deg, rgba(10, 10, 11, .6) 0%, transparent 16%, transparent 72%, var(--bg) 100%);
  }

  nav {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 26px var(--pad);
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  }
  nav .brand { display: flex; gap: 12px; align-items: baseline; }
  nav .brand b { font-weight: 500; }
  nav .brand span { color: var(--muted); }
  nav ul { display: flex; gap: 28px; list-style: none; align-items: center; }
  nav ul a { color: #b9bac2; transition: color .2s; }
  nav ul a:hover { color: var(--fg); }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .22);
    background: rgba(10, 10, 11, .35);
    color: var(--fg) !important; transition: border-color .2s, background .2s;
  }
  .pill:hover { border-color: rgba(255, 255, 255, .45); background: rgba(10, 10, 11, .55); }

  .portrait {
    position: absolute; z-index: 2; right: clamp(0px, 5vw, 96px); bottom: 0; height: 94svh; width: auto;
    pointer-events: none; user-select: none;
    filter: drop-shadow(0 30px 60px rgba(0, 0, 0, .45));
  }

  .copy {
    position: absolute; z-index: 6; left: var(--pad); top: 50%; transform: translateY(-46%);
    max-width: min(640px, 50vw);
  }
  .eyebrow {
    display: flex; gap: 10px; align-items: center;
    font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #a3a4ad;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  h1 { margin: 26px 0 28px; font-weight: 600; font-size: clamp(46px, 7.2vw, 118px); line-height: .9; letter-spacing: -.045em; }
  h1 .hi { display: block; margin-bottom: .45em; font-size: .36em; font-weight: 500; letter-spacing: -.02em; color: #a3a4ad; }
  h1 em { font-style: normal; color: var(--accent); }
  .lead { font-size: clamp(17px, 1.5vw, 21px); line-height: 1.4; color: #d3d4da; }
  .slot { display: inline-grid; vertical-align: bottom; overflow: hidden; height: 1.4em; }
  .slot span {
    grid-area: 1 / 1; white-space: nowrap; color: var(--fg);
    transform: translateY(110%); opacity: 0;
    transition: transform .8s cubic-bezier(.7, 0, .2, 1), opacity .8s;
  }
  .slot span.in { transform: none; opacity: 1; }
  .slot span.out { transform: translateY(-110%); }
  .slot span.wait { transition: none; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 38px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 15px 22px; border-radius: 999px;
    font-size: 15px; font-weight: 500; transition: transform .25s, border-color .25s, background .25s;
  }
  .btn.primary { background: var(--accent); color: #0a0b10; }
  .btn.primary:hover { transform: translateY(-2px); }
  .btn.ghost { border: 1px solid rgba(255, 255, 255, .22); background: rgba(10, 10, 11, .35); }
  .btn.ghost:hover { border-color: rgba(255, 255, 255, .45); }

  .scroll-cue {
    position: absolute; z-index: 6; left: var(--pad); bottom: 28px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }

  .next { min-height: 70vh; padding: 120px var(--pad); border-top: 1px solid var(--line); }
  .next p { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 860px) {
    nav ul li:not(:last-child) { display: none; }
    .portrait {
      height: 70svh; top: 56px; bottom: auto; right: auto; left: 50%; transform: translateX(-62%);
      -webkit-mask-image: linear-gradient(#000 58%, transparent 96%); mask-image: linear-gradient(#000 58%, transparent 96%);
      filter: none; /* тень обрезалась бы маской по краю картинки и давала вертикальную черту */
    }
    .shade {
      background: linear-gradient(180deg, rgba(10, 10, 11, .7) 0%, transparent 14%, transparent 35%, rgba(10, 10, 11, .7) 58%, var(--bg) 92%);
    }
    .copy { top: auto; bottom: 40px; right: var(--pad); transform: none; max-width: none; }
    h1 { margin: 16px 0 18px; font-size: clamp(38px, 11.5vw, 64px); }
    .cta { margin-top: 24px; }
    .btn { padding: 13px 18px; font-size: 14px; }
    .scroll-cue { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .slot span { transition: none; }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <canvas id="metal" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>

  <nav>
    <div class="brand"><b>Данил</b><span>портфолио · 2026</span></div>
    <ul>
      <li><a href="#cases">Кейсы</a></li>
      <li><a href="#cases">Опыт</a></li>
      <li><a href="#cases">Контакты</a></li>
      <li><a class="pill" href="#cases">CV · PDF ↓</a></li>
    </ul>
  </nav>

  <img class="portrait" src="/*__PORTRAIT__*/" alt="Данил">

  <div class="copy">
    <div class="eyebrow"><span class="dot"></span>Открыт к предложениям</div>
    <h1><span class="hi">Привет, я Данил —</span>маркетолог, который <em>считает.</em></h1>
    <p class="lead">Делаю так, чтобы <span class="slot" id="slot"></span></p>
    <div class="cta">
      <a class="btn primary" href="#cases">Смотреть кейсы ↓</a>
      <a class="btn ghost" href="#cases">Резюме, PDF</a>
    </div>
  </div>

  <div class="scroll-cue">↓ Скролл</div>
</section>

<section class="next" id="cases">
  <p>Здесь начнутся кейсы — прототип показывает только главный экран</p>
</section>

<script>
(function () {
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hero = document.getElementById("hero");
  const cv = document.getElementById("metal");

  /* ---------- подпись с меняющимся окончанием ---------- */
  const phrases = ["реклама окупалась.", "лиды доходили до продаж.", "продукт находил своих людей."];
  const slot = document.getElementById("slot");
  const spans = phrases.map(t => {
    const s = document.createElement("span");
    s.textContent = t;
    slot.appendChild(s);
    return s;
  });
  // состояние каждой фразы вычисляется заново на каждом шаге — подпись не рассинхронизируется
  let phrase = 0;
  const paint = prev => spans.forEach((el, i) => { el.className = i === phrase ? "in" : i === prev ? "out" : "wait"; });
  paint(-1);
  if (!reduceMotion) {
    (function rotatePhrase() {
      setTimeout(() => {
        const prev = phrase;
        phrase = (phrase + 1) % spans.length;
        paint(prev);
        rotatePhrase();
      }, 2800);
    })();
  }

  /* ---------- жидкий металл ---------- */
  const gl = cv.getContext("webgl", { antialias: false, alpha: false, depth: false, powerPreference: "low-power" });
  if (!gl) {
    hero.style.background = "linear-gradient(160deg, #2a2b30, #8d9096 45%, #1b1c20)";
    return;
  }

  const DROPS = 8;          // сколько волн от движения курсора живут одновременно
  const SCALE = 3.0;        // масштаб «волн» на экране
  const VS = `attribute vec2 p; varying vec2 vUv;
    void main(){ vUv = vec2(p.x * .5 + .5, .5 - p.y * .5); gl_Position = vec4(p, 0., 1.); }`;
  const FS = `precision highp float;
    varying vec2 vUv;
    uniform float uTime, uAspect, uHover;
    uniform vec2 uMouse;
    uniform vec4 uDrops[${DROPS}];   // xy — где, z — когда, w — сила

    // рельеф поверхности: медленная зыбь + бугор под курсором + расходящиеся кольца
    float height(vec2 p) {
      float t = uTime * .32;
      float h = .34 * sin(p.x * 1.55 + p.y * .85 + t)
              + .25 * sin(-p.x * .7 + p.y * 1.9 + t * .8 + 1.3)
              + .15 * sin(p.x * 2.7 - p.y * 1.6 - t * 1.1 + 2.1)
              + .08 * sin(p.x * 4.3 + p.y * 3.1 + t * 1.4 + .5)
              + .035 * sin(p.x * 6.8 - p.y * 5.2 + t * 1.7 + 3.);
      vec2 dm = p - uMouse;
      h += uHover * .38 * exp(-dot(dm, dm) * 7.);
      for (int i = 0; i < ${DROPS}; i++) {
        vec4 d = uDrops[i];
        float age = uTime - d.z;
        if (d.w <= 0. || age < 0. || age > 3.) continue; // затухшие волны не считаем
        float r = length(p - d.xy);
        float x = r - age * 1.15;
        h += d.w * exp(-age * 1.4) * sin(x * 17.) * exp(-x * x * 14.) * .16;
      }
      return h;
    }

    void main(){
      vec2 p = vec2(vUv.x * uAspect, vUv.y) * ${SCALE.toFixed(1)};
      float e = .012;
      float h0 = height(p);
      vec2 g = vec2(height(p + vec2(e, 0.)) - h0, height(p + vec2(0., e)) - h0) / e;
      vec3 n = normalize(vec3(-g * .6, 1.));

      // ртуть = почти чистое зеркало: цвет даёт отражённая «студия».
      // Плавные полосы отражения + резкие точечные блики — так читается жидкий металл.
      vec3 r = reflect(vec3(0., 0., -1.), n);
      float band = .5 + .5 * sin(r.y * 3.4 + r.x * 1.2 + .2);
      band = smoothstep(.08, .92, band);
      vec3 env = mix(vec3(.05, .055, .065), vec3(.74, .76, .8), band);
      env += vec3(1.) * pow(max(dot(r, normalize(vec3(-.3, -.45, .84))), 0.), 70.) * .9;   // блик софтбокса
      env += vec3(.85, .9, 1.) * pow(max(dot(r, normalize(vec3(.5, .2, .84))), 0.), 24.) * .25; // мягкий контровой
      float fres = .8 + .2 * pow(1. - n.z, 1.5);
      vec3 col = env * fres * vec3(.92, .94, .97);
      gl_FragColor = vec4(col, 1.);
    }`;
  function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aP = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const uTime = U("uTime"), uAspect = U("uAspect"), uHover = U("uHover"), uMouse = U("uMouse"), uDrops = U("uDrops[0]");

  let aspect = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    // металл гладкий — считаем в половинном разрешении экрана (и не больше ~1.1 Мп):
    // на глаз разницы нет, а нагрузка на видеокарту в разы ниже
    let k = Math.min(window.devicePixelRatio || 1, 2) * 0.5;
    k = Math.min(k, Math.sqrt(1.1e6 / (r.width * r.height)));
    cv.width = Math.max(1, Math.round(r.width * k));
    cv.height = Math.max(1, Math.round(r.height * k));
    aspect = r.width / r.height;
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform1f(uAspect, aspect);
    kick();
  }

  /* ---------- курсор ---------- */
  const t0 = performance.now();
  const drops = new Float32Array(DROPS * 4);
  let dropIdx = 0;
  let target = null;               // позиция курсора в координатах шейдера
  let mouse = [aspect * 1.5, 1.5];  // сглаженная позиция
  let hover = 0;
  let lastDrop = null;
  let lastInput = -1e9;
  let visible = true;
  let rafId = 0;
  let frameNo = 0;

  const toShader = (cx, cy) => {
    const r = cv.getBoundingClientRect();
    return [(cx - r.left) / r.width * aspect * SCALE, (cy - r.top) / r.height * SCALE];
  };
  function drop(x, y, power, time) {
    const o = dropIdx * 4;
    drops[o] = x; drops[o + 1] = y; drops[o + 2] = time; drops[o + 3] = power;
    dropIdx = (dropIdx + 1) % DROPS;
  }

  function frame(now) {
    rafId = 0;
    const t = (now - t0) / 1000;
    const idle = now - lastInput > 4000;

    // в покое — 30 кадров в секунду: металл течёт медленно, разницы не видно
    frameNo++;
    if (!(idle && frameNo % 2)) {
      if (target) {
        mouse[0] += (target[0] - mouse[0]) * 0.12;
        mouse[1] += (target[1] - mouse[1]) * 0.12;
        hover += (1 - hover) * 0.08;
        const d = lastDrop ? Math.hypot(mouse[0] - lastDrop[0], mouse[1] - lastDrop[1]) : 1;
        if (d > 0.18) { drop(mouse[0], mouse[1], Math.min(1, 0.45 + d), t); lastDrop = mouse.slice(); }
      } else {
        hover *= 0.95;
      }
      gl.uniform1f(uTime, t);
      gl.uniform1f(uHover, hover);
      gl.uniform2f(uMouse, mouse[0], mouse[1]);
      gl.uniform4fv(uDrops, drops);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    if (visible && !reduceMotion) rafId = requestAnimationFrame(frame);
  }
  function kick() {
    if (!rafId) rafId = requestAnimationFrame(frame);
  }

  hero.addEventListener("pointermove", e => {
    target = toShader(e.clientX, e.clientY);
    lastInput = performance.now();
  }, { passive: true });
  hero.addEventListener("pointerdown", e => {
    const [x, y] = toShader(e.clientX, e.clientY);
    drop(x, y, 1, (performance.now() - t0) / 1000);
    target = [x, y];
    lastInput = performance.now();
  });
  hero.addEventListener("pointerleave", () => { target = null; });
  const release = e => { if (e.pointerType !== "mouse") target = null; };
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);

  new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible) kick(); }).observe(hero);
  document.addEventListener("visibilitychange", () => { visible = !document.hidden; if (visible) kick(); });
  new ResizeObserver(resize).observe(hero);

  resize();
  // при загрузке — две «капли» рядом с портретом, чтобы сразу было видно, что поверхность жидкая
  if (!reduceMotion) {
    setTimeout(() => {
      const r = cv.getBoundingClientRect();
      const [x, y] = toShader(r.left + r.width * 0.72, r.top + r.height * 0.42);
      const t = (performance.now() - t0) / 1000;
      drop(x, y, 1, t);
      drop(x - 0.5, y + 0.35, 0.7, t + 0.35);
    }, 500);
  }
})();
</script>
</body>
</html>
