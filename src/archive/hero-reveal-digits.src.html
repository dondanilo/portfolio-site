<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Данил — главный экран (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --fg: #f2f1ec;
    --muted: #8a8c97;
    --accent: #c8ff2e;
    --line: rgba(255, 255, 255, .09);
    --pad: clamp(16px, 4vw, 56px);
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* статичный «контровой» свет за головой — без пересчёта на каждое движение мыши */
  .hero {
    position: relative; height: 100svh; min-height: 620px; overflow: hidden;
    background: radial-gradient(760px circle at 76% 26%, rgba(255, 255, 255, .07), transparent 68%);
  }

  nav {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 26px var(--pad);
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  }
  nav .brand { display: flex; gap: 12px; align-items: baseline; }
  nav .brand b { font-weight: 500; }
  nav .brand span { color: var(--muted); }
  nav ul { display: flex; gap: 28px; list-style: none; align-items: center; }
  nav ul a { color: var(--muted); transition: color .2s; }
  nav ul a:hover { color: var(--fg); }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--fg) !important; transition: border-color .2s, background .2s;
  }
  .pill:hover { border-color: rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .04); }

  .portrait { position: absolute; right: clamp(0px, 5vw, 96px); bottom: 0; height: 94svh; z-index: 1; }
  .portrait canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 1.2s ease; touch-action: pan-y; }
  .portrait canvas.ready { opacity: 1; }

  .copy {
    position: absolute; z-index: 6; left: var(--pad); top: 50%; transform: translateY(-46%);
    max-width: min(640px, 50vw);
  }
  .eyebrow {
    display: flex; gap: 10px; align-items: center;
    font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  h1 { margin: 26px 0 28px; font-weight: 600; font-size: clamp(46px, 7.2vw, 118px); line-height: .9; letter-spacing: -.045em; }
  h1 .hi { display: block; margin-bottom: .45em; font-size: .36em; font-weight: 500; letter-spacing: -.02em; color: var(--muted); }
  h1 em { font-style: normal; color: var(--accent); }
  .lead { font-size: clamp(17px, 1.5vw, 21px); line-height: 1.4; color: #c9cad1; }
  .slot { display: inline-grid; vertical-align: bottom; overflow: hidden; height: 1.4em; }
  .slot span {
    grid-area: 1 / 1; white-space: nowrap; color: var(--fg);
    transform: translateY(110%); opacity: 0;
    transition: transform .8s cubic-bezier(.7, 0, .2, 1), opacity .8s;
  }
  .slot span.in { transform: none; opacity: 1; }
  .slot span.out { transform: translateY(-110%); }
  .slot span.wait { transition: none; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 38px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 15px 22px; border-radius: 999px;
    font-size: 15px; font-weight: 500; transition: transform .25s, border-color .25s;
  }
  .btn.primary { background: var(--accent); color: #0a0b10; }
  .btn.primary:hover { transform: translateY(-2px); }
  .btn.ghost { border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: rgba(255, 255, 255, .3); }

  .hint {
    position: absolute; z-index: 6; pointer-events: none;
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 10px; opacity: 0; transition: opacity .6s;
  }
  .hint.on { opacity: 1; }
  .hint i { display: block; width: 36px; height: 1px; background: currentColor; }

  .scroll-cue {
    position: absolute; z-index: 6; left: var(--pad); bottom: 28px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }

  .next { min-height: 70vh; padding: 120px var(--pad); border-top: 1px solid var(--line); }
  .next p { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 860px) {
    nav ul li:not(:last-child) { display: none; }
    .portrait { height: 70svh; top: 56px; bottom: auto; right: auto; left: 50%; transform: translateX(-62%); }
    /* низ фото растворяем прозрачностью, а не заливкой цветом фона — иначе проступает прямоугольник */
    .portrait canvas { -webkit-mask-image: linear-gradient(#000 58%, transparent 96%); mask-image: linear-gradient(#000 58%, transparent 96%); }
    .copy { top: auto; bottom: 40px; right: var(--pad); transform: none; max-width: none; }
    h1 { margin: 16px 0 18px; font-size: clamp(38px, 11.5vw, 64px); }
    .cta { margin-top: 24px; }
    .btn { padding: 13px 18px; font-size: 14px; }
    .scroll-cue { display: none; }
    .hint {
      transform: translateX(-50%); padding: 8px 12px; border-radius: 999px; color: var(--fg); white-space: nowrap;
      background: rgba(10, 10, 11, .78);
    }
    .hint i { display: none; }
    .hint span::before { content: "↑ "; }
  }
  @media (prefers-reduced-motion: reduce) {
    .slot span { transition: none; }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <nav>
    <div class="brand"><b>Данил</b><span>портфолио · 2026</span></div>
    <ul>
      <li><a href="#cases">Кейсы</a></li>
      <li><a href="#cases">Опыт</a></li>
      <li><a href="#cases">Контакты</a></li>
      <li><a class="pill" href="#cases">CV · PDF ↓</a></li>
    </ul>
  </nav>

  <div class="portrait" id="portrait">
    <canvas id="gl" aria-label="Фото Данила" role="img"></canvas>
  </div>

  <div class="copy">
    <div class="eyebrow"><span class="dot"></span>Открыт к предложениям</div>
    <h1><span class="hi">Привет, я Данил —</span>маркетолог, который <em>считает.</em></h1>
    <p class="lead">Делаю так, чтобы <span class="slot" id="slot"></span></p>
    <div class="cta">
      <a class="btn primary" href="#cases">Смотреть кейсы ↓</a>
      <a class="btn ghost" href="#cases">Резюме, PDF</a>
    </div>
  </div>

  <div class="hint" id="hint"><span id="hintText">проведи курсором по лицу</span><i></i></div>
  <div class="scroll-cue">↓ Скролл</div>
</section>

<section class="next" id="cases">
  <p>Здесь начнутся кейсы — прототип показывает только главный экран</p>
</section>

<script>
(async function () {
  const LM = /*__LANDMARKS__*/;
  const SRC = "/*__PORTRAIT__*/";

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hero = document.getElementById("hero");
  const wrap = document.getElementById("portrait");
  const cv = document.getElementById("gl");
  const hint = document.getElementById("hint");

  /* ---------- подпись с меняющимся окончанием ---------- */
  const phrases = ["реклама окупалась.", "лиды доходили до продаж.", "продукт находил своих людей."];
  const slot = document.getElementById("slot");
  const spans = phrases.map(t => {
    const s = document.createElement("span");
    s.textContent = t;
    slot.appendChild(s);
    return s;
  });
  // состояние каждой фразы вычисляется заново на каждом шаге — подпись не рассинхронизируется
  let phrase = 0;
  const paint = prev => spans.forEach((el, i) => { el.className = i === phrase ? "in" : i === prev ? "out" : "wait"; });
  paint(-1);
  function rotatePhrase() {
    const prev = phrase;
    phrase = (phrase + 1) % spans.length;
    paint(prev);
    setTimeout(rotatePhrase, 2800);
  }

  /* ---------- портрет и шрифт ---------- */
  const img = new Image();
  img.src = SRC;
  await img.decode();
  const TW = img.naturalWidth, TH = img.naturalHeight;
  wrap.style.aspectRatio = TW + " / " + TH;
  try {
    await Promise.race([document.fonts.load('700 16px "JetBrains Mono"'), new Promise(r => setTimeout(r, 1500))]);
  } catch (e) {}

  /* ---------- второй слой: лицо, собранное из метрик (рисуется один раз) ---------- */
  const CELL = 12;
  const cols = Math.floor(TW / CELL), rows = Math.floor(TH / CELL);
  const sCan = document.createElement("canvas");
  sCan.width = cols; sCan.height = rows;
  const sCtx = sCan.getContext("2d", { willReadFrequently: true });
  sCtx.drawImage(img, 0, 0, cols, rows);
  const px = sCtx.getImageData(0, 0, cols, rows).data;

  const WORDS = "CPL ROMI CTR MQL SQL CAC LTV ROAS CR UTM A/B GA4 SEO ASO ROI LEADS +38% ×2 72% ";
  function glyphLayer() {
    const c = document.createElement("canvas");
    c.width = TW; c.height = TH;
    const g = c.getContext("2d");
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = `700 ${Math.round(CELL * 1.08)}px "JetBrains Mono", ui-monospace, monospace`;
    let k = 0;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const p = (j * cols + i) * 4;
        const ch = WORDS[k++ % WORDS.length];
        if (px[p + 3] < 128) continue;
        const lum = (0.2126 * px[p] + 0.7152 * px[p + 1] + 0.0722 * px[p + 2]) / 255;
        // контрастная кривая: кожа, борода и тени читаются разной яркостью
        const tc = Math.min(1, Math.max(0, (lum - 0.12) / 0.72));
        const b = tc * tc * (3 - 2 * tc);
        const glyph = ch === " " ? (b > 0.55 ? "·" : "") : ch;
        if (!glyph || b < 0.04) continue;
        g.fillStyle = b > 0.9 ? "rgba(246,255,220,.95)" : `rgba(200,255,46,${0.06 + 0.94 * b})`;
        g.fillText(glyph, i * CELL + CELL / 2, j * CELL + CELL / 2 + 1);
      }
    }
    return c;
  }

  /* ---------- WebGL ---------- */
  const gl = cv.getContext("webgl", { premultipliedAlpha: false, antialias: false, alpha: true });
  if (!gl) {
    const fallback = img.cloneNode();
    fallback.style.cssText = "width:100%;height:100%;display:block";
    wrap.replaceChildren(fallback);
    return;
  }

  // След курсора — до N точек; маска считается прямо в шейдере как сумма мягких пятен.
  // Никакого 2D-холста и перекачки текстуры каждый кадр.
  const N = 24;
  const RADIUS = 0.085;      // радиус пятна в долях высоты портрета
  const FADE = 0.45;         // постоянная затухания следа, секунды
  const VS = `attribute vec2 p; varying vec2 vUv;
    void main(){ vUv = vec2(p.x * .5 + .5, .5 - p.y * .5); gl_Position = vec4(p, 0., 1.); }`;
  const FS = `precision highp float;
    varying vec2 vUv;
    uniform sampler2D uBase, uGlyph;
    uniform vec3 uTrail[${N}];
    uniform float uTime, uAspect, uRadius;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
      return mix(mix(hash(i), hash(i + vec2(1., 0.)), u.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), u.x), u.y);
    }
    void main(){
      vec4 base = texture2D(uBase, vUv);
      if (base.a < .01) { gl_FragColor = vec4(0.); return; }
      float f = 0.;
      for (int i = 0; i < ${N}; i++) {
        vec3 t = uTrail[i];
        vec2 d = (vUv - t.xy) * vec2(uAspect, 1.);
        f += t.z * exp(-dot(d, d) / (uRadius * uRadius));
      }
      // лёгкий шум по краю — он «жидкий», но без тяжёлых вычислений
      vec2 q = vUv * vec2(3.2, 5.) + vec2(uTime * .12, -uTime * .09);
      float n = noise(q) * .65 + noise(q * 2.1) * .35;
      float v = f + (n - .5) * .45;
      float edge = smoothstep(.42, .52, v);
      float rim = smoothstep(.36, .45, v) - smoothstep(.5, .6, v);
      vec4 g = texture2D(uGlyph, vUv);
      vec3 rev = mix(vec3(.025, .03, .02), g.rgb, g.a);
      vec3 col = mix(base.rgb, rev, edge) + vec3(.78, 1., .18) * rim * .3;
      gl_FragColor = vec4(col, base.a);
    }`;
  function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aP = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);

  function tex(unit, source, name) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.uniform1i(U(name), unit);
  }
  tex(0, img, "uBase");
  tex(1, glyphLayer(), "uGlyph");
  gl.uniform1f(U("uAspect"), TW / TH);
  gl.uniform1f(U("uRadius"), RADIUS);
  const uTrail = U("uTrail[0]"), uTime = U("uTime");
  const trailData = new Float32Array(N * 3);

  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5); // исходник мягкий — больше 1.5x не нужно
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    gl.viewport(0, 0, cv.width, cv.height);
    kick(true);
  }

  /* ---------- курсор, интро и цикл отрисовки ---------- */
  let target = null;     // где курсор (uv портрета) или null
  let head = null;       // сглаженная позиция «кисти»
  let headPower = 0;     // яркость пятна под самим курсором
  const trail = [];      // {x, y, t} — точки следа
  let lastMove = -1e9;
  let intro = null;
  let touched = false;
  let visible = true;
  let rafId = 0;

  function toUv(cx, cy) {
    const r = cv.getBoundingClientRect();
    return [(cx - r.left) / r.width, (cy - r.top) / r.height];
  }
  function feed(u, v, now) {
    target = [u, v];
    lastMove = now;
    kick();
  }

  const eyeY = (LM.lPupil[1] + LM.rPupil[1]) / 2;
  const introPts = [
    [LM.face[0] - 0.06, eyeY + 0.05], [LM.lPupil[0], LM.lPupil[1] + 0.01], [LM.nose[0], LM.nose[1] - 0.01],
    [LM.rPupil[0], LM.rPupil[1]], [LM.face[0] + LM.face[2] + 0.05, LM.mouth[1] + 0.02],
  ];
  function catmull(p0, p1, p2, p3, t) {
    const t2 = t * t, t3 = t2 * t;
    return [0, 1].map(i => 0.5 * ((2 * p1[i]) + (-p0[i] + p2[i]) * t + (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * t2 + (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * t3));
  }
  function introAt(k) {
    const e = 0.5 - 0.5 * Math.cos(Math.PI * k);
    const n = introPts.length - 1, f = e * n, i = Math.min(n - 1, Math.floor(f));
    const P = j => introPts[Math.max(0, Math.min(n, j))];
    return catmull(P(i - 1), P(i), P(i + 1), P(i + 2), f - i);
  }

  const ar = TW / TH;
  function frame(now) {
    rafId = 0;
    const t = now / 1000;

    if (intro && now >= intro.start) {
      const k = (now - intro.start) / intro.dur;
      if (k >= 1) { intro = null; target = null; if (!touched) hint.classList.add("on"); }
      else { const p = introAt(k); feed(p[0], p[1], now); }
    }

    if (target) {
      if (!head) head = target.slice();
      head[0] += (target[0] - head[0]) * 0.3;
      head[1] += (target[1] - head[1]) * 0.3;
      headPower = Math.min(1, headPower + 0.15);
      const last = trail[trail.length - 1];
      if (!last || Math.hypot((head[0] - last.x) * ar, head[1] - last.y) > RADIUS * 0.4) {
        trail.push({ x: head[0], y: head[1], t });
        if (trail.length > N - 1) trail.shift();
      }
    } else {
      headPower *= 0.9;
    }

    // слот 0 — пятно под курсором, остальные — затухающий след
    let alive = headPower > 0.02;
    trailData.fill(0);
    if (head) { trailData[0] = head[0]; trailData[1] = head[1]; trailData[2] = headPower * 0.9; }
    for (let i = 0; i < trail.length; i++) {
      const p = trail[trail.length - 1 - i];
      const s = Math.exp(-(t - p.t) / FADE) * 0.75;
      if (s > 0.02) alive = true;
      const o = (i + 1) * 3;
      trailData[o] = p.x; trailData[o + 1] = p.y; trailData[o + 2] = s;
    }

    gl.uniform3fv(uTrail, trailData);
    gl.uniform1f(uTime, reduceMotion ? 0 : t);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    cv.classList.add("ready");

    // крутимся только пока что-то видно или двигается; в покое — ноль нагрузки
    const busy = intro || alive || (target && now - lastMove < 2500);
    if (visible && busy) rafId = requestAnimationFrame(frame);
  }
  function kick(force) {
    if (!rafId && (visible || force)) rafId = requestAnimationFrame(frame);
  }

  window.addEventListener("pointermove", e => {
    const [u, v] = toUv(e.clientX, e.clientY);
    const inside = u > -0.1 && u < 1.1 && v > -0.05 && v < 1.05;
    if (!inside) { if (target) { target = null; kick(); } return; }
    if (intro) return;
    if (!touched) { touched = true; hint.classList.remove("on"); }
    feed(u, v, performance.now());
  }, { passive: true });
  cv.addEventListener("pointerdown", e => {
    const [u, v] = toUv(e.clientX, e.clientY);
    if (!touched) { touched = true; hint.classList.remove("on"); }
    head = [u, v];
    feed(u, v, performance.now());
  });
  hero.addEventListener("pointerleave", () => { target = null; kick(); });
  const release = e => { if (e.pointerType !== "mouse") { target = null; kick(); } };
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);

  new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible) kick(); }).observe(hero);
  document.addEventListener("visibilitychange", () => { visible = !document.hidden; if (visible) kick(); });
  new ResizeObserver(resize).observe(wrap);

  /* ---------- подсказка у лица ---------- */
  const isTouch = matchMedia("(hover: none)").matches;
  document.getElementById("hintText").textContent = isTouch ? "проведи пальцем по лицу" : "проведи курсором по лицу";
  function placeHint() {
    const r = cv.getBoundingClientRect(), h = hero.getBoundingClientRect();
    if (innerWidth <= 860) {
      // на телефоне слева от лица нет места — ставим плашку на грудь, под лицом
      hint.style.right = "auto";
      hint.style.left = (r.left - h.left + (LM.face[0] + LM.face[2] / 2) * r.width) + "px";
      hint.style.top = (r.top - h.top + (LM.mouth[1] + 0.2) * r.height) + "px";
    } else {
      // левее силуэта на уровне рта, чтобы текст не ложился на шею
      const row = Math.min(rows - 1, Math.round(LM.mouth[1] * rows));
      let edge = 0;
      while (edge < cols && px[(row * cols + edge) * 4 + 3] < 128) edge++;
      hint.style.left = "auto";
      hint.style.right = (h.right - (r.left + edge / cols * r.width) + 18) + "px";
      hint.style.top = (r.top - h.top + LM.mouth[1] * r.height) + "px";
    }
  }
  placeHint();
  addEventListener("resize", placeHint);

  resize();
  if (reduceMotion) hint.classList.add("on");
  else {
    intro = { start: performance.now() + 700, dur: 1700 };
    kick();
    setTimeout(rotatePhrase, 2800);
  }
})();
</script>
</body>
